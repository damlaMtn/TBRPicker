<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TBRPicker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f8f4ef;
            font-family: 'Georgia', serif;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .btn-pick {
            background-color: #2E75B6;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 1.1rem;
        }

            .btn-pick:hover {
                background-color: #245f96;
                color: white;
            }

        .book-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1a1a1a;
        }

        .book-author {
            font-size: 1.1rem;
            color: #555;
        }

        .book-pages {
            font-size: 0.95rem;
            color: #888;
        }

        #result {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 600px;">

        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="fw-bold" style="color: #2E75B6;">📚 TBRPicker</h1>
            <p class="text-muted">Can't decide what to read next? Let fate decide.</p>
        </div>

        <!-- Filters -->
        <!-- Upload Section -->
        <div class="card p-4 mb-4">
            <h5 class="mb-3" style="color: #2E75B6;">Import your Goodreads TBR</h5>
            <p class="text-muted" style="font-size:0.9rem;">Export your library from Goodreads → Account → Settings → Export Library</p>
            <div class="mb-3">
                <input type="file" id="csvFile" class="form-control" accept=".csv" />
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-pick flex-fill" onclick="uploadCSV()">Import (replaces all)</button>
                <button class="btn btn-outline-primary flex-fill" onclick="syncCSV()">Sync (adds new only)</button>
            </div>
            <div id="importMessage" class="mt-2 text-center" style="display:none;"></div>
        </div>

        <!-- Shelf filter - hidden until books are imported -->
        <div id="shelfSection" style="display:none;">
            <label class="form-label">Shelves</label>
            <div id="shelfCheckboxes" class="d-flex flex-wrap gap-2 mb-2"></div>
        </div>


        <div class="card p-4 mb-4">
            <h5 class="mb-3" style="color: #2E75B6;">Filters <span class="text-muted fw-normal" style="font-size:0.9rem;">(optional)</span></h5>
            <div class="mb-3">
                <label class="form-label">Max pages</label>
                <input type="number" id="maxPages" class="form-control" placeholder="e.g. 300" />
            </div>
            <div class="mb-3">
                <label class="form-label">Genre</label>
                <input type="text" id="genre" class="form-control" placeholder="e.g. fantasy" />
            </div>
        </div>

        <!-- Button -->
        <div class="text-center mb-4">
            <button class="btn btn-pick" onclick="pickBook()">Pick a book for me</button>
        </div>

        <!-- Result -->
        <div id="result" class="card p-4 text-center">
            <div class="mb-2">📖</div>
            <div id="bookTitle" class="book-title mb-1"></div>
            <div id="bookAuthor" class="book-author mb-2"></div>
            <div id="bookPages" class="book-pages"></div>
        </div>

        <!-- No result message -->
        <div id="noResult" class="text-center text-muted mt-3" style="display:none;">
            No books found matching your filters. Try adjusting them!
        </div>

    </div>

    <script>
        async function pickBook() {
            const maxPages = document.getElementById('maxPages').value;
            const genre = document.getElementById('genre').value;

            // Get checked shelves
            const checkedShelves = [...document.querySelectorAll('#shelfCheckboxes input:checked')]
                .map(cb => cb.value);

            let url = '/api/book/random';
            const params = new URLSearchParams();
            if (maxPages) params.append('maxPages', maxPages);
            if (genre) params.append('genre', genre);
            if (checkedShelves.length > 0) params.append('shelf', checkedShelves.join(','));
            if ([...params].length > 0) url += '?' + params.toString();

            try {
                const response = await fetch(url);

                if (response.status === 404) {
                    document.getElementById('result').style.display = 'none';
                    document.getElementById('noResult').style.display = 'block';
                    return;
                }

                const book = await response.json();
                document.getElementById('bookTitle').textContent = book.title;
                document.getElementById('bookAuthor').textContent = book.author;
                document.getElementById('bookPages').textContent = book.pageCount ? `${book.pageCount} pages` : '';
                document.getElementById('result').style.display = 'block';
                document.getElementById('noResult').style.display = 'none';

            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function uploadCSV() {
            const fileInput = document.getElementById('csvFile');
            const message = document.getElementById('importMessage');

            if (!fileInput.files[0]) {
                message.style.display = 'block';
                message.style.color = '#888';
                message.textContent = 'Please select a CSV file first.';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                message.style.display = 'block';
                message.style.color = '#888';
                message.textContent = 'Importing...';

                const response = await fetch('/api/book/upload', {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();
                message.style.color = response.ok ? '#2E75B6' : '#dc3545';
                message.textContent = text;

                if (response.ok) await loadShelves();

            } catch (error) {
                message.style.color = '#dc3545';
                message.textContent = 'Something went wrong. Please try again.';
            }
        }

        async function loadShelves() {
            const response = await fetch('/api/book/shelves');
            const shelves = await response.json();

            const container = document.getElementById('shelfCheckboxes');
            container.innerHTML = '';

            shelves.forEach(shelf => {
                const label = document.createElement('label');
                label.className = 'badge border';
                label.style.cssText = 'cursor:pointer; font-size:0.85rem; padding: 8px 12px; color: #2E75B6; border-color: #2E75B6 !important; font-weight: normal;';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = shelf;
                checkbox.style.marginRight = '6px';

                // Check to-read by default if it exists
                if (shelf === 'to-read') checkbox.checked = true;

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(shelf));
                container.appendChild(label);
            });

            document.getElementById('shelfSection').style.display = 'block';
        }

        async function syncCSV() {
            const fileInput = document.getElementById('csvFile');
            const message = document.getElementById('importMessage');

            if (!fileInput.files[0]) {
                message.style.display = 'block';
                message.style.color = '#888';
                message.textContent = 'Please select a CSV file first.';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                message.style.display = 'block';
                message.style.color = '#888';
                message.textContent = 'Syncing...';

                const response = await fetch('/api/book/sync', {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();
                message.style.color = response.ok ? '#2E75B6' : '#dc3545';
                message.textContent = text;

                if (response.ok) await loadShelves();

            } catch (error) {
                message.style.color = '#dc3545';
                message.textContent = 'Something went wrong. Please try again.';
            }
        }
    </script>
</body>
</html>
