<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TBRPicker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f8f4ef;
            font-family: 'Georgia', serif;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .btn-pick {
            background-color: #2E75B6;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 1.1rem;
        }

            .btn-pick:hover {
                background-color: #245f96;
                color: white;
            }

        .book-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1a1a1a;
        }

        .book-author {
            font-size: 1.1rem;
            color: #555;
        }

        .book-pages {
            font-size: 0.95rem;
            color: #888;
        }

        #result {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 600px;">

        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="fw-bold" style="color: #2E75B6;">📚 TBRPicker</h1>
            <p class="text-muted">Can't decide what to read next? Let fate decide.</p>
        </div>

        <!-- Filters -->
        <div class="card p-4 mb-4">
            <h5 class="mb-3" style="color: #2E75B6;">Filters <span class="text-muted fw-normal" style="font-size:0.9rem;">(optional)</span></h5>
            <div class="mb-3">
                <label class="form-label">Max pages</label>
                <input type="number" id="maxPages" class="form-control" placeholder="e.g. 300" />
            </div>
            <div class="mb-3">
                <label class="form-label">Genre</label>
                <input type="text" id="genre" class="form-control" placeholder="e.g. fantasy" />
            </div>
        </div>

        <!-- Button -->
        <div class="text-center mb-4">
            <button class="btn btn-pick" onclick="pickBook()">Pick a book for me</button>
        </div>

        <!-- Result -->
        <div id="result" class="card p-4 text-center">
            <div class="mb-2">📖</div>
            <div id="bookTitle" class="book-title mb-1"></div>
            <div id="bookAuthor" class="book-author mb-2"></div>
            <div id="bookPages" class="book-pages"></div>
        </div>

        <!-- No result message -->
        <div id="noResult" class="text-center text-muted mt-3" style="display:none;">
            No books found matching your filters. Try adjusting them!
        </div>

    </div>

    <script>
        async function pickBook() {
            const maxPages = document.getElementById('maxPages').value;
            const genre = document.getElementById('genre').value;

            let url = '/api/book/random';
            const params = new URLSearchParams();
            if (maxPages) params.append('maxPages', maxPages);
            if (genre) params.append('genre', genre);
            if ([...params].length > 0) url += '?' + params.toString();

            try {
                const response = await fetch(url);

                if (response.status === 404) {
                    document.getElementById('result').style.display = 'none';
                    document.getElementById('noResult').style.display = 'block';
                    return;
                }

                const book = await response.json();

                document.getElementById('bookTitle').textContent = book.title;
                document.getElementById('bookAuthor').textContent = book.author;
                document.getElementById('bookPages').textContent = book.pageCount ? `${book.pageCount} pages` : '';
                document.getElementById('result').style.display = 'block';
                document.getElementById('noResult').style.display = 'none';

            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
